<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipe View, UI v4 mockup</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="app-arr.css">
<link rel="preload" href="../../fonts/martian-mono/MartianMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<div id="app">
  <header id="ticker" role="status" aria-label="Network summary"></header>
  <nav id="rail" aria-label="Views"></nav>
  <main id="stage">
    <section id="pipe" aria-label="Pipe View">
      <svg id="pv" role="img" aria-label="Produced water network as a metro map"></svg>
      <canvas id="pk" aria-hidden="true"></canvas>
      <div id="pv-hud"></div>
    </section>
    <section id="arr" aria-label="Arrangement"></section>
    <section id="road" aria-label="Truck road"></section>
  </main>
  <footer id="transport" aria-label="Transport"></footer>
</div>
<div id="tip" role="tooltip"><div class="tip-in"></div></div>
<noscript>This mockup needs JavaScript.</noscript>
<script type="module" src="main.js"></script>
</body>
</html>
